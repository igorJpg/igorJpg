name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Atualiza a cada 24 horas
  workflow_dispatch: # Permite rodar manualmente na aba "Actions"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Platane/snk@v3
        with:
          github_user_name: igorJpg
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6b4034&color_dots=#ebedf0,#c8f7e0,#8fe0c0,#3fa7a0,#1f5f8a
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f4a261&color_dots=#161b22,#1b2a4a,#2f5d8a,#3fa7a0,#c8f7e0
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
